<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-label="Python cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="r0" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="r1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0abfc" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f0abfc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="r2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>
  <circle cx="1240" cy="180" r="440" fill="url(#r0)"/>
  <circle cx="300" cy="640" r="420" fill="url(#r1)"/>
  <circle cx="820" cy="380" r="360" fill="url(#r2)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2">
    <path d="M0 560 C 300 460, 600 660, 900 540 S 1400 440, 1600 540"/>
    <path d="M0 620 C 300 520, 600 720, 900 600 S 1400 500, 1600 600"/>
    <path d="M0 680 C 300 580, 600 780, 900 660 S 1400 560, 1600 660"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.14">
    <circle cx="180" cy="180" r="6"/>
    <circle cx="240" cy="180" r="6"/>
    <circle cx="300" cy="180" r="6"/>
    <circle cx="1420" cy="640" r="6"/>
    <circle cx="1480" cy="640" r="6"/>
  </g>
  <rect width="1600" height="800" filter="url(#grain)" opacity="0.6"/>
</svg>
